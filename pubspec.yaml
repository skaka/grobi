name: timer_grobi
description: "التوقيت الغروبي — ساعة غروبية وتقويم هجري ومواقيت صلاة دقيقة."
publish_to: 'none'
version: 0.0.1+1000

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # حساب مواقيت الصلاة (DateTime، طرق متعددة) — لا يدعم elevation فنحسبه يدوياً
  adhan: ^2.0.0
  # تحويل التاريخ الهجري الحسابي
  hijri: ^3.0.1
  # GPS + الارتفاع عن سطح البحر
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  # إدارة الحالة
  flutter_riverpod: ^2.5.1
  # التنسيق والأرقام والتعريب
  intl: ^0.20.2
  # تخزين الإعدادات وآخر موقع
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^22.0.1
  http: ^1.6.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  # قراءة الإصدار ورقم البناء وقت التشغيل (صفحة «عن»)
  package_info_plus: ^10.2.0
  # فتح رابط الموقع والبريد من صفحة «عن»
  url_launcher: ^6.3.2
  # حسّاسات الجهاز (مغناطيسي + تسارع) لحساب اتجاه البوصلة في شاشة القبلة
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # توليد أيقونة التطبيق من شعار غروبي
  flutter_launcher_icons: ^0.14.1

# إعداد أيقونة التطبيق (شغّل: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"                 # أيقونة كاملة (legacy + iOS)
  adaptive_icon_background: "assets/icon/bg.png"      # خلفية متكيّفة: سماء الغروب
  adaptive_icon_foreground: "assets/icon/fg.png"      # مقدّمة متكيّفة: الهلال والنجمة
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png            # شعار التطبيق (يُعرض في صفحة «عن»)

  fonts:
    # خط متغيّر (variable) — Flutter يربط fontWeight بمحور wght تلقائياً
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
